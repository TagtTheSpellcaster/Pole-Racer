<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>Pole Racer</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:#000;overflow:hidden;overscroll-behavior:none;touch-action:none;user-select:none;-webkit-user-select:none;font-family:"Courier New",monospace}
#app{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center}
#stage{position:relative;width:min(100vw,calc(100vh*4/3));width:min(100vw,calc(100dvh*4/3));aspect-ratio:4/3;max-height:100vh;max-height:100dvh}
canvas{display:block;width:100%;height:100%;background:#000}
#ctl{display:none}
body.touch #ctl{display:flex}
.grp{display:flex;gap:2.5vmin;align-items:center;justify-content:center}
.btn{font:bold 3.4vmin "Courier New",monospace;color:#fff;background:rgba(255,255,255,.14);border:.5vmin solid rgba(255,255,255,.55);border-radius:50%;width:min(24vw,22dvh);height:min(24vw,22dvh);display:flex;align-items:center;justify-content:center;text-align:center;touch-action:none;padding:0;line-height:1.1}
.btn.sm{width:min(16vw,12dvh);height:min(16vw,12dvh);font-size:2.4vmin}
.btn.on{background:rgba(255,220,0,.5);border-color:#ffe000}
@media (orientation:portrait){
 body.touch #app{justify-content:flex-start}
 body.touch #stage{width:100vw}
 body.touch #ctl{position:relative;flex:1;width:100%;align-items:center;justify-content:space-between;padding:0 3vw}
 .grp.m{flex-direction:column}
 .grp{gap:1.5vw}
 .btn{font-size:3.6vw;width:20vw;height:20vw}
 .btn.sm{font-size:2.8vw;width:15vw;height:15vw}
}
@media (orientation:landscape){
 body.touch #ctl{position:fixed;inset:0;pointer-events:none}
 body.touch .btn{pointer-events:auto;opacity:.6;width:min(15vw,30dvh);height:min(15vw,30dvh)}
 body.touch .btn.sm{width:min(10vw,20dvh);height:min(10vw,20dvh)}
 .grp.l{position:fixed;left:2vw;bottom:3vh}
 .grp.r{position:fixed;right:2vw;bottom:3vh}
 .grp.m{position:fixed;right:2vw;top:3vh}
}
</style>
</head>
<body>
<div id="app">
 <div id="stage"><canvas id="c" width="640" height="480"></canvas></div>
 <div id="ctl">
  <div class="grp l"><button class="btn" data-a="left">&#9664;</button><button class="btn" data-a="right">&#9654;</button></div>
  <div class="grp m"><button class="btn sm" data-a="gear" id="gearBtn">GEAR<br>LO</button><button class="btn sm" data-a="pause">PAUSE</button></div>
  <div class="grp r"><button class="btn" data-a="brake">BRAKE</button><button class="btn" data-a="gas">GAS</button></div>
 </div>
</div>
<script>
(() => {
'use strict';
/* ================= CONSTANTS ================= */
const W=640,H=480,HALF=W/2;
const SEG=200,RUMBLE=3,ROAD=1200,DD=170,CAMH=1000;
const CAMD=1/Math.tan(50*Math.PI/180);
const PLAYERZ=CAMH*CAMD*1.14;
const HORIZON=188,VS=H/2*1.25;
const MAXSPD=SEG*60,LOCAP=0.55,CARW=480,CAMFOLLOW=0.55,FOG=5;
const U_PLAYER=CAMD/PLAYERZ*HALF;
const GROUND_Y=HORIZON+(CAMD/PLAYERZ)*CAMH*VS;
const VERSION='1.24';
const DRIVES=[{name:'EASY',k:.55,p:1,tau:0,tm:1,off:0},{name:'INTERMEDIATE',k:1.2,p:.9,tau:.4,tm:1.18,off:.12},{name:'EXPERT',k:3.2,p:.4,tau:.7,tm:1.3,off:.22}];
const START_BACK=400,GRID_GAP=700,LAPS=3,STEP=1/60,PERIOD=1280;

const cv=document.getElementById('c'),ctx=cv.getContext('2d');
const clamp=(v,a,b)=>v<a?a:v>b?b:v;
const mod=(a,n)=>((a%n)+n)%n;
const lerp=(a,b,t)=>a+(b-a)*t;
function mulberry32(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}

/* ================= THEMES ================= */
function skyline(seed,minH,maxH){const r=mulberry32(seed);const pts=[];let x=0;let h=minH+r()*(maxH-minH);pts.push([0,h]);
 while(x<PERIOD){x=Math.min(PERIOD,x+22+r()*46);pts.push([x,h]);if(x>=PERIOD)break;h=minH+r()*(maxH-minH);pts.push([x,h]);}return pts;}
const FUJI=[[0,10],[200,14],[330,40],[430,84],[520,118],[580,138],[600,150],[620,138],[680,118],[770,84],[870,40],[1000,14],[1280,10]];
const HILLS=[[0,8],[110,28],[240,14],[380,34],[520,12],[660,30],[800,10],[940,32],[1090,14],[1280,8]];
const MESA=[[0,10],[80,10],[100,60],[200,60],[220,10],[360,10],[380,44],[430,44],[450,10],[640,10],[660,70],[760,70],[780,10],[960,10],[980,40],[1100,40],[1120,10],[1280,10]];
const DUNES=[[0,6],[160,26],[320,8],[500,30],[700,10],[900,28],[1100,8],[1280,6]];
const FARHILLS=[[0,24],[160,50],[330,34],[520,64],[700,40],[900,70],[1100,38],[1280,24]];
const ALPS=[[0,20],[160,60],[280,120],[330,100],[420,50],[560,90],[640,130],[700,96],[820,40],[1000,100],[1090,125],[1180,70],[1280,20]];
const CLIFFS=[[0,40],[90,70],[180,110],[260,112],[300,60],[420,56],[520,118],[640,122],[700,70],[820,60],[930,108],[1040,112],[1120,50],[1280,40]];
function spruce(seed,minH,maxH){const r=mulberry32(seed);const pts=[[0,20]];for(let x=0;x<PERIOD;x+=24){pts.push([x+12,minH+r()*(maxH-minH)]);pts.push([Math.min(x+24,PERIOD),20]);}return pts;}
const PASTEL=['#e3c9a2','#d9a38a','#e8dcc0','#c9b79c','#e6b9a0','#b8c4cc','#f0e4c8'];
function genCity(segs,N,r){
 for(let k=8;k<N-3;k++){if(segs[k].tun)continue;
  if(r()<.30){const side=r()<.5?-1:1;segs[k].spr.push({k:'bldg',off:side*(2.4+r()*1.6),w:1300+r()*900,hh:1300+r()*2000,col:PASTEL[(r()*PASTEL.length)|0],cw:0});}
  if(r()<.07){const side=r()<.5?-1:1;segs[k].spr.push({k:'palm',off:side*(1.9+r()*.5),s:.8+r()*.3,cw:0});}
 }}
function genValley(segs,N,r){
 for(let k=8;k<N-3;k++){const sg=segs[k];if(sg.tun||sg.river>=2)continue;const rs=sg.river;
  if(r()<.16){const side=r()<.5?-1:1;let o=rs===side?3.8+r()*2.2:2.0+r()*3;if((side<0?sg.rgL:sg.rgR)&&o>4.0)o=2.2+r()*1.6;sg.spr.push({k:'pine',off:side*o,s:.9+r()*.6,cw:0});}
 }}
function genForest(segs,N,r){
 for(let k=8;k<N-3;k++){if(segs[k].tun)continue;
  for(const side of [-1,1]){if(r()<.3){const o=1.55+r()*2.3;segs[k].spr.push({k:'pine',off:side*o,s:.9+r()*.7,cw:(o<1.95&&r()<.45)?220:0});}}
 }}
function genCoast(segs,N,r){
 for(let k=8;k<N-3;k++){const sg=segs[k];if(sg.mt&&sg.mr>.25&&k%3===0)sg.spr.push({k:'post',off:1.17,cw:0});}}
function genBridges(segs,N,r){
 for(let k=8;k<N-3;k++){const sg=segs[k];
  if(sg.river>=2){if(k%9===0)sg.spr.push({k:'arch',off:0,cw:0});continue;}
  if(r()<.16){const side=r()<.5?-1:1;sg.spr.push({k:'pine',off:side*(2.0+r()*2.0),s:.9+r()*.6,cw:0});}
  r();r();r();r();
 }}
function genAlpine(segs,N,r){
 for(let k=8;k<N-3;k++){if(segs[k].tun)continue;
  for(const side of [-1,1])if(r()<.2)segs[k].spr.push({k:'pine',off:side*(1.9+r()*3),s:.9+r()*.7,cw:0});
 }}
const THEMES=[
 {name:'MOUNT CIRCUIT',skyA:'#2f6fd8',skyB:'#9ed0ff',haze:'#c4defa',grass:['#12a02c','#0e8d26'],road:['#74747a','#6a6a70'],rum:['#d92121','#f2f2f2'],lane:'#efefef',sun:null,band:null,
  layers:[{pts:FUJI,col:'#4a5a96',sp:1,snow:104},{pts:HILLS,col:'#2d7b4b',sp:2.2}],deco:'tree'},
 {name:'HARBOR RUN',skyA:'#3aa2e8',skyB:'#cfeeff',haze:'#d6efff',grass:['#d9c07a','#cdb36a'],road:['#6f7075','#66676c'],rum:['#2060d8','#f2f2f2'],lane:'#f4f4f4',sun:null,band:{h:7,col:'#2a78c2'},
  layers:[{pts:skyline(7,14,60),col:'#6f8fb8',sp:1},{pts:HILLS,col:'#3f9a52',sp:2.2}],deco:'palm'},
 {name:'DUSK DESERT',skyA:'#3b1f72',skyB:'#ff9a46',haze:'#f2a85e',grass:['#c9772f','#bc6c28'],road:['#6a6064','#625a5e'],rum:['#f0f0f0','#c02020'],lane:'#f4e8d0',sun:{x:420,y:150,r:44,col:'#ffe38a'},band:null,
  layers:[{pts:MESA,col:'#7c3247',sp:1},{pts:DUNES,col:'#a14b2a',sp:2.2}],deco:'cactus'},
 {name:'RIVIERA STREETS',skyA:'#2f8de0',skyB:'#bfe6ff',haze:'#d8ecf8',grass:['#bdb6aa','#aea79c'],road:['#5e5e64','#55555b'],rum:['#d92121','#f2f2f2'],lane:'#f0f0f0',sun:null,band:{h:9,col:'#1f6fb8'},
  layers:[{pts:FARHILLS,col:'#9fb4c8',sp:1},{pts:skyline(21,16,64),col:'#d8c19c',sp:1.8}],gen:genCity},
 {name:'CASCADE VALLEY',ranges:true,skyA:'#4a90d9',skyB:'#dff0ff',haze:'#cfe6f0',grass:['#3f9a3a','#378f34'],road:['#74747a','#6a6a70'],rum:['#d92121','#f2f2f2'],lane:'#efefef',sun:null,band:null,
  layers:[{pts:ALPS,col:'#7f93b8',sp:1,snow:80},{pts:CLIFFS,col:'#4f6a5a',sp:1.6},{pts:HILLS,col:'#2f6b3b',sp:2.4}],gen:genValley,bb:false},
 {name:'PINE FOREST',skyA:'#5f7f9a',skyB:'#c9d9d2',haze:'#b9cbbf',grass:['#2d5a2a','#285125'],road:['#6a6a68','#62625f'],rum:['#d8d8d0','#9a3a2a'],lane:'#e8e6dc',sun:null,band:null,
  layers:[{pts:FARHILLS,col:'#7f9a98',sp:1},{pts:spruce(5,40,78),col:'#2f5a46',sp:1.7},{pts:spruce(9,26,52),col:'#1f4535',sp:2.6}],gen:genForest,bb:false},
 {name:'COAST ROAD',skyA:'#2a7fd0',skyB:'#c4e4ff',haze:'#a9cde4',grass:['#7a8a52','#72824c'],road:['#74747a','#6a6a70'],rum:['#d92121','#f2f2f2'],lane:'#efefef',sun:null,band:null,
  sea:['#2b6fa8','#2766a0'],rock:[[128,112,94],[104,91,78],[88,78,68]],
  layers:[{pts:ALPS,col:'#8fa3bf',sp:1,snow:80},{pts:FARHILLS,col:'#6f8aa8',sp:1.6}],gen:genCoast,bb:false},
 {name:'VIADUCT RUN',ranges:true,skyA:'#4c8fd6',skyB:'#e3f1ff',haze:'#d0e6f2',grass:['#4a9a3c','#42903a'],road:['#74747a','#6a6a70'],rum:['#d92121','#f2f2f2'],lane:'#efefef',sun:null,band:null,
  val:['#2d6a3a','#27602f'],
  layers:[{pts:ALPS,col:'#8196ba',sp:1,snow:80},{pts:CLIFFS,col:'#587566',sp:1.6},{pts:HILLS,col:'#2f6b3b',sp:2.4}],gen:genBridges,bb:false},
 {name:'ALPINE TUNNELS',skyA:'#3a7fd0',skyB:'#cfe6ff',haze:'#cfe0ee',grass:['#3f8f3a','#378634'],road:['#6e6e74','#64646a'],rum:['#d92121','#f2f2f2'],lane:'#efefef',sun:null,band:null,hill:true,
  layers:[{pts:ALPS,col:'#7f93b8',sp:1,snow:80},{pts:CLIFFS,col:'#6a6a64',sp:1.6},{pts:HILLS,col:'#2f6b3b',sp:2.4}],gen:genAlpine,bb:false}
];
THEMES.forEach(t=>{const g=ctx.createLinearGradient(0,0,0,HORIZON);g.addColorStop(0,t.skyA);g.addColorStop(1,t.skyB);t.grad=g;});

/* ================= TRACKS ================= */
const TRACKDEFS=[
 [['S',160],['C',90,3],['S',60],['C',100,-4],['C',70,-4],['S',120],['C',110,2],['S',80],['C',80,5],['C',60,-5],['S',100],['C',140,4],['S',50],['C',90,6],['S',150],['C',70,3],['C',70,-3],['S',120],['C',120,4],['S',90],['C',80,-5],['S',160]],
 [['S',140],['C',80,4],['C',70,-4],['S',60],['C',100,-5],['S',40],['C',60,3],['C',60,-3],['C',60,3],['S',90],['C',120,5],['S',70],['C',90,-4],['C',90,5],['S',110],['C',70,-6],['S',50],['C',80,6],['S',100],['C',100,3],['S',60],['C',110,4],['S',120]],
 [['S',220],['C',100,-3],['S',200],['C',70,6],['S',90],['C',90,-6],['S',160],['C',150,-2],['S',180],['C',80,5],['C',80,-5],['S',220],['C',120,-4],['S',200],['C',70,6],['S',150]],
 [['S',130],['C',70,4],['S',30],['C',60,6],['S',70],['C',80,5],['C',60,-5],['S',80],['TB'],['S',40],['C',90,3],['S',50],['TE'],['C',70,4],['S',40],['C',80,-6],['S',60],['C',60,5],['S',100],['C',90,-4],['C',60,4],['S',80],['C',100,-6],['S',90],['C',70,-5],['S',120]],
 [['S',150],['RV',-1],['C',100,3],['C',100,4],['S',60],['RV',2],['S',14],['RV',1],['C',90,-5],['C',70,5],['S',100],['C',120,4],['S',50],['RV',2],['S',14],['RV',-1],['C',80,-6],['S',80],['C',110,3],['S',60],['RV',2],['S',14],['RV',1],['C',90,4],['S',120],['C',120,-3],['C',80,5],['S',90],['RV',2],['S',14],['RV',-1],['S',100]],
 [['S',140],['C',70,-4],['C',60,4],['S',50],['C',90,5],['S',40],['C',70,-5],['C',70,5],['S',60],['C',110,-4],['S',30],['C',60,-6],['S',50],['C',90,-6],['S',70],['C',80,4],['C',80,-3],['S',60],['C',120,-5],['S',40],['C',70,-5],['S',90],['C',90,4],['C',60,-6],['S',80],['C',100,3],['S',120]],
 [['S',120],['C',80,3],['S',60],['MT',1],['S',40],['C',100,4],['C',80,-5],['S',60],['C',120,4],['S',30],['C',90,6],['C',70,-6],['S',70],['C',110,5],['S',40],['C',100,5],['C',60,-4],['S',80],['C',90,-6],['S',40],['C',120,4],['S',60],['MT',0],['C',80,-3],['S',100]],
 [['S',150],['C',90,3],['S',40],['RV',2],['S',40],['RV',0],['C',100,4],['S',50],['RV',3],['S',60],['C',80,-4],['S',130],['RV',0],['C',70,-5],['C',90,5],['S',60],['RV',2],['S',130],['RV',0],['C',110,-4],['S',50],['RV',3],['S',100],['C',90,5],['C',70,5],['S',100],['RV',0],['C',80,4],['S',80],['RV',1],['C',100,-3],['S',40],['RV',0],['RV',2],['S',70],['RV',0],['C',90,5],['S',100]],
 [['S',140],['C',80,4],['S',40],['TB'],['S',70],['TE'],['C',90,4],['S',30],['TB'],['C',80,5],['S',40],['TE'],['S',60],['C',70,-5],['TB'],['S',90],['TE'],['C',100,4],['S',40],['C',60,-5],['TB'],['S',60],['C',70,4],['S',50],['TE'],['S',50],['C',90,4],['S',30],['TB'],['S',100],['TE'],['C',80,-5],['S',50],['C',80,5],['S',100]]
];
const BBT=['TURBO','SPEED','RACE','GRIP','NITRO','FUEL','AUTO','KART'];
const BBC=[['#e8c200','#101018'],['#e83030','#ffffff'],['#2a6fe0','#ffffff'],['#f5f5f5','#d02020'],['#20a050','#ffffff']];
const tracks=[];
function mkPt(z){return{wz:z,ok:false,scale:0,sx:0,sy:0,sw:0,cz:0}}
function getTrack(i){
 if(tracks[i])return tracks[i];
 const def=TRACKDEFS[i],th=THEMES[i],segs=[],r=mulberry32(1234+i*77);
 let inTun=false,riv=0,inMt=false;
 const add=c=>{const k=segs.length;segs.push({index:k,p1:mkPt(k*SEG),p2:mkPt((k+1)*SEG),curve:c,spr:[],fog:1,tun:inTun,river:riv,mt:inMt});};
 const eIn=(a,b,p)=>a+(b-a)*p*p;
 const eIO=(a,b,p)=>a+(b-a)*(-Math.cos(p*Math.PI)/2+0.5);
 for(const c of def){
  if(c[0]==='S'){for(let n=0;n<c[1];n++)add(0);}
  else if(c[0]==='TB')inTun=true;
  else if(c[0]==='TE')inTun=false;
  else if(c[0]==='RV')riv=c[1];
  else if(c[0]==='MT')inMt=!!c[1];
  else{const len=c[1],cu=c[2],en=Math.round(len*.28),ho=Math.round(len*.44),le=len-en-ho;
   for(let n=0;n<en;n++)add(eIn(0,cu,n/en));
   for(let n=0;n<ho;n++)add(cu);
   for(let n=0;n<le;n++)add(eIO(cu,0,n/le));}
 }
 const N=segs.length;
 for(let k=0;k<N;k++){const sg=segs[k];if(!sg.mt)continue;
  let d=16;for(let j=1;j<16;j++){if(!segs[(k+j)%N].mt||!segs[(k-j+N)%N].mt){d=j;break;}}
  const rr=Math.min(1,d/16);sg.mr=rr;sg.mL=1.2+(1-rr)*.9;sg.mR=1.15+(1-rr)*1.4;sg.mh=(2500+650*Math.sin(k*.09)+380*Math.sin(k*.31+1)+(r()-.5)*40)*rr;}
 for(let k=0;k<N;k++){const sg=segs[k];if(sg.river!==1&&sg.river!==-1)continue;
  let d=30;for(let j=1;j<30;j++){if(segs[(k+j)%N].river>=2||segs[(k-j+N)%N].river>=2){d=j;break;}}
  const f=d/30,e=f*f*(3-2*f);sg.ro=2.35*e+.15*(1-e);sg.rw=1.9+1.0*(1-e);}

 if(th.ranges){const fr=mulberry32(4242+i),falls=[];let kk0=40;
  while(kk0<N-60){falls.push({k:kk0,sd:fr()<.5?-1:1});kk0+=22+((fr()*150)|0);}
  for(const sd of [-1,1]){let g=null;const groups=[];
   for(const f of falls.filter(f=>f.sd===sd)){if(g&&f.k-g.last<=70){g.last=f.k;g.fs.push(f);}else{g={first:f.k,last:f.k,fs:[f]};groups.push(g);}}
   for(const g of groups){const a=Math.max(8,g.first-42),b=Math.min(N-8,g.last+46);
    for(let kk=a;kk<=b;kk++){const u=Math.min((kk-a)/22,(b-kk)/22,1),o={f:u*u*(3-2*u),H:3600+800*Math.sin(kk*.07)+450*Math.sin(kk*.19+1),fl:0,fp:0};segs[kk][sd<0?'rgL':'rgR']=o;}
    for(const f of g.fs)for(let j=0;j<3;j++){const o=segs[f.k+j][sd<0?'rgL':'rgR'];if(o){o.fl=j===1?2:1;o.fp=(f.k*.37)%1;}}}}}
 if(th.gen)th.gen(segs,N,r);
 else for(let k=8;k<N-3;k++){if(r()<0.10){const side=r()<.5?-1:1;segs[k].spr.push({k:th.deco,off:side*(2.2+r()*2.5),s:.8+r()*.5,cw:0});}}
 if(th.bb!==false){let bi=10;
  while(bi<N-6){const side=r()<.5?-1:1,c=BBC[(r()*BBC.length)|0],tx=BBT[(r()*BBT.length)|0];
   if(!segs[bi].tun&&!segs[bi].river)segs[bi].spr.push({k:'bb',off:side*1.7,w:700,h:420,cw:700,txt:tx,c1:c[0],c2:c[1]});
   bi+=12+((r()*26)|0);}}

function toTitle(){G.training=false;G.mode='title';G.modeT=0;G.paused=false;initDemo();}
function beginTrack(){
 loadTrack(G.track);cars=[];
 P.dist=-START_BACK;P.x=0;P.s=0;P.dr=0;P.crashT=-1;P.inv=0;setGear(0);
 G.qualLimit=((L+START_BACK)/MAXSPD)*Math.max(1.3,1.6-.04*G.level)*DRIVES[G.drive].tm;
 G.time=G.qualLimit;G.lapTime=0;G.bestLap=0;G.cd=4;G.cdNext='qualify';G.mode='countdown';G.modeT=0;G.cdPrev=4;
}
function setupRace(){
 cars=[];const slot=G.qualPos-1;let ai=0;
 for(let i=0;i<8;i++){const d=-START_BACK-i*GRID_GAP,o=i%2?.42:-.42;
  if(i===slot){P.dist=d;P.x=o;}else cars.push(newCar(ai++,d,o));}
 P.s=0;P.dr=0;P.crashT=-1;P.inv=0;setGear(0);
 const br=baseRace();const tm=DRIVES[G.drive].tm;G.time=br*Math.max(1.25,1.55-.03*G.level)*tm;G.ext=br*Math.max(1.15,1.4-.03*G.level)*tm;
 G.lapFloor=-1;G.lapTime=0;G.rank=G.prevRank=G.qualPos;G.cd=4;G.cdNext='race';G.mode='countdown';G.modeT=0;G.cdPrev=4;
}
function timeUp(why){G.mode='gameover';G.modeT=0;G.over=why||'TIME UP';G.paused=false;if(G.score>G.hi){G.hi=Math.floor(G.score);try{localStorage.setItem('pr_hi',G.hi)}catch(e){}}beep(160,.7,'sawtooth',.15);}
function crash(){P.crashT=0;P.s=0;boom();}
function initDemo(){loadTrack(0);P.dist=2000;P.x=0;P.s=.55;P.crashT=-1;cars=[];for(let i=0;i<6;i++){const c=newCar(i,P.dist+1500+i*1300,(i%2?.4:-.4));c.speed=.5;c.base=.5+i*.03;cars.push(c);}}

function updateCars(dt,running){
 const LOOK=2400;
 for(const c of cars){
  const seg=segAt(c.dist);
  let target=running?c.base*(1-.035*Math.abs(seg.curve)):0,avoid=0;
  const consider=(od,oo,os)=>{
   const dz=mod(od-c.dist+L/2,L)-L/2;
   if(dz>0&&dz<LOOK){const diff=oo-c.off;
    if(Math.abs(diff)<.34){let d=diff>=0?-1:1;if(c.off<-.62&&d<0)d=1;if(c.off>.62&&d>0)d=-1;
     avoid+=d*(1-dz/LOOK)*1.2;
     if(dz<420&&Math.abs(diff)<.26)target=Math.min(target,os);}}
  };
  for(const o of cars){if(o!==c)consider(o.dist,o.off,o.speed);}
  consider(P.dist,P.x,P.s);
  c.off+=avoid*dt*.9;
  c.wt-=dt;if(c.wt<=0){c.wt=2+rr()*5;c.wT=(rr()*2-1)*.65;}
  if(Math.abs(avoid)<.01)c.off+=clamp(c.wT-c.off,-.18*dt,.18*dt);
  c.off=clamp(c.off,-.85,.85);
  if(c.speed<target)c.speed=Math.min(target,c.speed+.28*dt);else c.speed=Math.max(target,c.speed-.6*dt);
  c.dist+=c.speed*MAXSPD*dt;
 }
}
function updatePlayer(dt,drive){
 if(P.inv>0)P.inv-=dt;
 if(P.crashT>=0){P.crashT+=dt;P.s=0;
  if(P.crashT>2.4){P.crashT=-1;P.x=0;P.s=0;P.dr=0;P.inv=2;setGear(0);}
  return;}
 const thr=drive?inp.gas:0,brk=drive?inp.brake:0,st=drive?inp.steer:0;
 let s=P.s,a=0;
 if(thr>0){
  if(P.gear===0){a=s<LOCAP?.55*thr*(1-.35*s/LOCAP):0;}
  else{const low=s<.22?.4+.6*(s/.22):1;a=.21*thr*low*(1.18-.55*s);}
 }
 if(P.gear===0&&s>LOCAP)a-=.45;
 if(brk>0)a-=1.0*brk;
 if(thr===0&&brk===0)a-=.09;
 if(Math.abs(P.x)>1.05&&s>.3)a-=.8;
 s=clamp(s+a*dt,0,1);
 const seg=segAt(P.dist);
 P.x+=st*2.6*s*dt;
 {const dm=DRIVES[G.drive],cc=seg.curve,tg=Math.sign(cc)*dm.k*Math.pow(Math.abs(cc),dm.p)*s*s;
  P.dr=dm.tau>0?P.dr+(tg-P.dr)*(1-Math.exp(-dt/dm.tau)):tg;P.x-=P.dr*dt;}
 if(Math.abs(P.x)>1.8){P.x=Math.sign(P.x)*1.8;s=Math.max(0,s-1.5*dt);}
 P.s=s;
 G.bg+=seg.curve*s*.45;
 const prevU=Math.floor(P.dist/SEG);
 P.dist+=s*MAXSPD*dt;
 const nowU=Math.floor(P.dist/SEG);
 if(drive&&!G.training)G.score+=s*dt*60;
 if(drive&&P.inv<=0){
  for(let k=prevU;k<=nowU;k++){const sg=segs[mod(k,N)];
   if((sg.tun&&Math.abs(P.x)>1.12)||(sg.river>=2&&Math.abs(P.x)>1.08)||(sg.mt&&(P.x<-sg.mL||P.x>sg.mR))){crash();return;}
   for(const sp of sg.spr){if(sp.cw>0&&Math.abs(P.x-sp.off)<(sp.cw/ROAD+CARW/ROAD)/2*.85){crash();return;}}}
  if(G.mode==='race'){
   for(const c of cars){const dz=mod(c.dist-P.dist+L/2,L)-L/2;
    if(Math.abs(dz)<330&&Math.abs(c.off-P.x)<.22){
     if(dz>=0&&P.s>c.speed+.02){crash();return;}
     if(dz<0){c.speed=Math.min(c.speed,P.s*.95);c.dist=P.dist-330;}
    }}
  }
 }
}
function step(dt){
 G.t+=dt;G.modeT+=dt;
 if(G.toastT>0)G.toastT-=dt;
 if(G.bannerT>0)G.bannerT-=dt;
 if(G.goT>0)G.goT-=dt;
 readInputs(dt);
 switch(G.mode){
 case 'title':{
  P.s=.55;P.x=.5*Math.sin(G.t*.6);P.dist+=P.s*MAXSPD*dt;G.bg+=segAt(P.dist).curve*P.s*.45;updateCars(dt,true);
  for(const c of cars)if(mod(c.dist-P.dist+L/2,L)-L/2<-3000){c.dist=P.dist+8000;}
  break;}
 case 'countdown':{
  G.cd-=dt;const ci=Math.ceil(G.cd);
  if(ci!==G.cdPrev&&ci>=1&&ci<=3){beep(440,.12,'square',.1);}
  G.cdPrev=ci;
  updatePlayer(dt,false);updateCars(dt,false);
  if(G.cd<=0){G.mode=G.cdNext;G.modeT=0;G.goT=1.4;beep(880,.4,'square',.12);
   if(G.mode==='race'){G.lapFloor=-1;G.lapTime=0;}}
  break;}
 case 'qualify':{
  G.time-=dt;G.lapTime+=dt;updatePlayer(dt,true);
  if(G.time<=0){timeUp('FAILED TO QUALIFY');break;}
  if(P.dist>=L){
   const ratio=G.lapTime/((L+START_BACK)/MAXSPD);
   G.qualPos=clamp(1+Math.ceil((ratio-1.14-DRIVES[G.drive].off)/.05),1,8);G.qualTime=G.lapTime;
   G.score+=(9-G.qualPos)*500;G.mode='qualified';G.modeT=0;beep(660,.3,'square',.1);}
  break;}
 case 'qualified':{
  P.s=Math.max(0,P.s-.5*dt);P.dist+=P.s*MAXSPD*dt;
  if(G.modeT>4)setupRace();
  break;}
 case 'race':{
  G.time-=dt;if(P.dist>=0)G.lapTime+=dt;
  updateCars(dt,true);updatePlayer(dt,true);
  let rk=1;for(const c of cars)if(c.dist>P.dist)rk++;
  if(rk<G.prevRank)G.score+=100*(G.prevRank-rk);
  G.prevRank=rk;G.rank=rk;
  const lf=Math.floor(P.dist/L);
  if(lf>G.lapFloor){G.lapFloor=lf;
   if(lf===0){G.lapTime=0;}
   else if(lf>=LAPS){
    G.finRank=rk;G.finBonus=(9-rk)*1000+Math.max(0,Math.ceil(G.time))*50;G.score+=G.finBonus;
    G.mode='finish';G.modeT=0;beep(990,.5,'square',.12);break;}
   else{G.time+=G.ext;G.bestLap=G.bestLap?Math.min(G.bestLap,G.lapTime):G.lapTime;G.lapTime=0;
    G.banner='LAP '+(lf+1)+'   +'+Math.round(G.ext)+' SEC';G.bannerT=2.5;beep(740,.25,'square',.1);}
  }
  if(G.time<=0)timeUp('TIME UP');
  break;}
 case 'finish':{
  P.s=Math.max(0,P.s-.4*dt);P.dist+=P.s*MAXSPD*dt;updateCars(dt,true);
  if(G.modeT>5.5){G.track=(G.track+1)%TRACKDEFS.length;if(G.track===0)G.level++;beginTrack();}
  break;}
 case 'training':{
  if(P.dist>=0)G.lapTime+=dt;
  updatePlayer(dt,true);
  const lf=Math.floor(P.dist/L);
  if(lf>G.lapFloor){G.lapFloor=lf;
   if(lf===0)G.lapTime=0;
   else{G.bestLap=G.bestLap?Math.min(G.bestLap,G.lapTime):G.lapTime;G.banner='LAP '+lf+'   '+fmt(G.lapTime);G.bannerT=3;G.lapN=lf;G.lapTime=0;beep(740,.2,'square',.08);}
  }
  break;}
 case 'gameover':{updateCars(dt,false);P.s=Math.max(0,P.s-.5*dt);break;}
 }
}

function proj(p,camX,camZ){
 p.cz=p.wz-camZ;
 if(p.cz<=CAMD){p.ok=false;return;}
 p.ok=true;p.scale=CAMD/p.cz;
 p.sx=Math.round(HALF+p.scale*(-camX)*HALF);
 p.sy=Math.round(HORIZON+p.scale*CAMH*VS);
 p.sw=Math.round(p.scale*ROAD*HALF);
}
function quad(x1,y1,x2,y2,x3,y3,x4,y4,col){ctx.fillStyle=col;ctx.beginPath();ctx.moveTo(x1,y1);ctx.lineTo(x2,y2);ctx.lineTo(x3,y3);ctx.lineTo(x4,y4);ctx.closePath();ctx.fill();}

  const tt=Math.max(0,Math.ceil(G.time));txt(String(tt),W/2,40,32,(tt<=10&&Math.floor(G.t*4)%2)?'#f33':'#ff0','center');
 }
 txt('LAP TIME',W-14,14,14,'#6ff','right');txt(fmt(G.lapTime),W-14,34,20,'#fff','right');
 if(G.bestLap)txt('BEST '+fmt(G.bestLap),W-14,56,14,'#ccc','right');
 txt(Math.round(P.s*256)+' km/h',14,466,20,'#fff');txt(DRIVES[G.drive].name+' MODE'+(G.night?'  NIGHT':''),14,446,11,'#9bd');
 const gx=W/2-26;ctx.fillStyle='#000';ctx.fillRect(gx,452,52,26);ctx.fillStyle=P.gear?'#e22':'#2c2';ctx.fillRect(gx+3,455,46,20);
 txt(P.gear?'HI':'LO',W/2,466,18,'#fff','center');
 if(m==='race'||(m==='countdown'&&G.cdNext==='race')||m==='finish')txt('LAP '+clamp(Math.floor(P.dist/L)+1,1,LAPS)+'/'+LAPS+'  POS '+G.rank+'/8',W-14,466,18,'#fff','right');
 else txt(TR.name,W-14,466,14,'#fff','right');
 if(G.map)drawMap();
 if(mouse.on)txt('MOUSE',W/2,90+30,12,'#8f8','center');
 if(m==='countdown'){

 }
 if((m==='qualify'||m==='race')&&G.goT>0){lights(3,true);txt('GO!',W/2,118,32,'#3f6','center');}
 if(G.bannerT>0)txt(G.banner,W/2,120,26,'#ff0','center');
 if(m==='qualified'){txt('QUALIFIED!',W/2,110,34,'#ff0','center');txt('LAP TIME '+fmt(G.qualTime),W/2,148,20,'#fff','center');txt('GRID POSITION '+G.qualPos,W/2,176,20,'#6ff','center');}
 if(m==='finish'){txt('RACE FINISHED',W/2,100,32,'#ff0','center');txt('POSITION '+G.finRank+' / 8',W/2,138,22,'#fff','center');txt('BONUS '+G.finBonus,W/2,166,20,'#6ff','center');txt('NEXT: '+THEMES[(G.track+1)%THEMES.length].name,W/2,194,16,'#ccc','center');}
 if(m==='gameover'){ctx.fillStyle='rgba(0,0,0,.55)';ctx.fillRect(0,HORIZON-70,W,200);
  txt('GAME OVER',W/2,HORIZON-30,44,'#f33','center');txt(G.over,W/2,HORIZON+14,22,'#ff0','center');txt('SCORE '+pad7(G.score),W/2,HORIZON+46,20,'#fff','center');
  if(G.modeT>1.2&&Math.floor(G.t*2)%2)txt('PRESS ENTER / TAP TO CONTINUE',W/2,HORIZON+84,16,'#fff','center');}
 if(G.paused){ctx.fillStyle='rgba(0,0,0,.65)';ctx.fillRect(0,0,W,H);txt('PAUSED',W/2,150,44,'#fff','center');
  box(W/2-130,222,260,44,'RESUME');box(W/2-130,292,260,44,'EXIT TO MENU');
  txt('TAP / P / ENTER / ESC = RESUME    Q = EXIT',W/2,372,12,'#ccc','center');txt('PAD: START = RESUME   B = EXIT',W/2,392,12,'#ccc','center');}
 if(G.toastT>0)txt(G.toast,W/2,H-90,14,'#fff','center');
}

/* ================= MAIN LOOP ================= */
loadTrack(0);initDemo();
let last=performance.now(),acc=0;
function frame(now){
 requestAnimationFrame(frame);
 let d=(now-last)/1000;last=now;if(!(d>=0))d=0;if(d>.25)d=.25;
 try{pollPad();}catch(e){padBlocked=true;}
 if(!G.paused){acc+=d;while(acc>=STEP){step(STEP);acc-=STEP;}}
 render();updateAudio();
}
requestAnimationFrame(frame);
window.__PR={G,P,inp,kb,DRIVES,step,render,getTrack,curves:i=>getTrack(i).segs.map(q=>q.curve),curveAt:(o=0)=>segAt(P.dist+o).curve,get cars(){return cars},get L(){return L}};
})();
